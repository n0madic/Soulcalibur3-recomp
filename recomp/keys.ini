# Soulcalibur III keyboard defaults. Unlisted controls use runtime defaults.
# Edit games/sc3/keys.ini in your WORK checkout; changes reload on focus.
# Movement: arrow keys. Start: Esc. Select: Tab or Backspace.
square = Z
triangle = V
circle = C
cross = X, Enter, Keypad Enter

# Free X/C/V from the upstream stick-click and rage shortcuts.
l3 = none
r3 = none
rage = none
